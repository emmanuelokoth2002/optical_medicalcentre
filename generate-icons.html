<!DOCTYPE html>
<html>
<head>
    <title>Generate App Icons</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .icon-container { margin: 20px 0; }
        canvas { border: 1px solid #ccc; margin: 10px; }
        .instructions { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Eye Sight Optical - Icon Generator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Right-click on each canvas below</li>
            <li>Select "Save image as..."</li>
            <li>Save with the suggested filename in the public folder</li>
        </ol>
    </div>

    <div class="icon-container">
        <h3>Favicon (32x32)</h3>
        <canvas id="favicon" width="32" height="32" style="image-rendering: pixelated;"></canvas>
        <p>Save as: <strong>favicon.ico</strong></p>
    </div>

    <div class="icon-container">
        <h3>Logo 192x192</h3>
        <canvas id="logo192" width="192" height="192"></canvas>
        <p>Save as: <strong>logo192.png</strong></p>
    </div>

    <div class="icon-container">
        <h3>Logo 512x512</h3>
        <canvas id="logo512" width="512" height="512"></canvas>
        <p>Save as: <strong>logo512.png</strong></p>
    </div>

    <script>
        function drawFavicon(canvas) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, 32, 32);
            
            // Eye shape
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(16, 12, 6, 4, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Pupil
            ctx.fillStyle = '#1e40af';
            ctx.beginPath();
            ctx.arc(16, 12, 2.5, 0, 2 * Math.PI);
            ctx.fill();
            
            // Highlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(17.5, 10.5, 1, 0, 2 * Math.PI);
            ctx.fill();
            
            // Company initials
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 6px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('ES', 16, 24);
        }

        function drawLogo192(canvas) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, 192, 192);
            
            // Eye shape
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(96, 70, 36, 24, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Pupil
            ctx.fillStyle = '#1e40af';
            ctx.beginPath();
            ctx.arc(96, 70, 15, 0, 2 * Math.PI);
            ctx.fill();
            
            // Highlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(105, 63, 6, 0, 2 * Math.PI);
            ctx.fill();
            
            // Company name
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('EYE SIGHT', 96, 120);
            ctx.font = '12px Arial';
            ctx.fillText('OPTICAL', 96, 140);
            ctx.font = '10px Arial';
            ctx.fillText('MEDICAL CENTER', 96, 155);
        }

        function drawLogo512(canvas) {
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, 512, 512);
            
            // Eye shape
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(256, 180, 96, 64, 0, 0, 2 * Math.PI);
            ctx.fill();
            
            // Pupil
            ctx.fillStyle = '#1e40af';
            ctx.beginPath();
            ctx.arc(256, 180, 40, 0, 2 * Math.PI);
            ctx.fill();
            
            // Highlight
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(280, 168, 16, 0, 2 * Math.PI);
            ctx.fill();
            
            // Company name
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 42px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('EYE SIGHT', 256, 320);
            ctx.font = '32px Arial';
            ctx.fillText('OPTICAL', 256, 370);
            ctx.font = '28px Arial';
            ctx.fillText('MEDICAL CENTER', 256, 410);
            ctx.font = '20px Arial';
            ctx.fillText('LTD', 256, 450);
        }

        // Generate all icons
        drawFavicon(document.getElementById('favicon'));
        drawLogo192(document.getElementById('logo192'));
        drawLogo512(document.getElementById('logo512'));
    </script>
</body>
</html>
